version: 2
updates:
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    groups:
      flake-inputs:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
